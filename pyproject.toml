[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-engine"
version = "0.1.0"
description = "Educational out-of-sample regime-switching VaR research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3", "pandas>=2,<3", "scipy>=1.10,<2",
  "matplotlib>=3.7,<4", "hmmlearn==0.3.3", "yfinance>=0.2.54,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
